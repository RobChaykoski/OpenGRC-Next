name: Dependency audit

on:
  schedule:
    # Weekly. Advisories are published against versions that do not change, so a
    # green build yesterday says nothing about today's exposure.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Composer audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Audit locked dependencies
        run: composer audit --locked

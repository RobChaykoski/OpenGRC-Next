name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what we support; the next minor is what we are about to
        # support. Testing both is how a framework upgrade stops being a surprise.
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, simplexml, sqlite3, xml, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Audit dependencies
        run: composer audit --locked --no-dev

      - name: Run tests
        run: php artisan test

  static-analysis:
    name: Style and static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, simplexml, sqlite3, xml, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Only files touched by the change. The wider tree is being migrated to
      # the current Pint ruleset; flip this to a full run once that is done.
      - name: Check style on changed files
        run: ./vendor/bin/pint --dirty --test

      # Non-blocking while the existing baseline is cleared. Remove
      # continue-on-error once phpstan.neon reports zero errors.
      - name: Static analysis
        continue-on-error: true
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  assets:
    name: Build assets (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vite 8 requires 20.19+ but Node 20 is end-of-life. Test current LTS lines.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assert the manifest exists
        run: test -f public/build/manifest.json

  doctor:
    name: Doctor (fresh install)
    runs-on: ubuntu-latest
    needs: [tests, assets]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, simplexml, sqlite3, xml, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Install OpenGRC unattended
        run: |
          php artisan opengrc:install --unattended
          # The installer writes the example URL. Point it at the CI host so the
          # doctor does not (correctly) flag a placeholder in a real deployment.
          sed -i 's#APP_URL=.*#APP_URL="http://127.0.0.1:8000"#' .env
          php artisan settings:set general.url "http://127.0.0.1:8000"
          php artisan optimize:clear

      - name: Run the doctor
        run: php artisan opengrc:doctor --strict
